<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Підслухано у Ліцеї 8</title>
  <meta name="description" content="Анонімна шкільна стрічка Ліцею №8 — клікабельний макет">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Тема застосовується до рендеру, щоб не було "блимання"
    (function () {
      var t = null;
      try { t = localStorage.getItem('pl8-theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <!-- Екран входу -->
  <div class="login" id="login" hidden></div>

  <!-- Основний застосунок -->
  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <aside class="aside" id="aside"></aside>
  </div>

  <!-- Мобільна навігація -->
  <nav class="tabbar" id="tabbar" hidden></nav>
  <button class="fab" id="fab" data-action="compose" aria-label="Новий допис" hidden></button>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
